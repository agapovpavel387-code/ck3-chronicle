name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Проверки титулов и истории написаны на Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: npm ci --no-audit --no-fund

      # Самопроверки рендера карты и разбора дампа идут на numpy, pillow, ijson.
      # Без них `npm test` падает на первом же таком наборе.
      - name: Install tool dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Первый гейт: версия, числа и документы сходятся с данными.
      # Разделены намеренно: по имени упавшего шага видно, какой гейт не сошёлся.
      - name: Version is the same everywhere
        run: python tools/stamp.py --check
      - name: Numbers match the data
        run: python tools/facts.py --check
      - name: Documents match the facts
        run: python tools/check_docs.py

      - name: Checks
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/test.log"

      # Второй гейт: счёт проверок в docs/facts.md совпадает с этим прогоном.
      - name: Facts must match this run
        run: |
          python tools/facts.py --write --test-log "$RUNNER_TEMP/test.log"
          git diff --exit-code docs/facts.json docs/facts.md

      # Третий гейт: архив собирается и проходит самопроверку.
      - name: Release builds and verifies
        run: python tools/release.py --skip-tests
